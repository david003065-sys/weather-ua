{{ define "layout" }}
<!DOCTYPE html>
<html lang="{{ .Lang }}" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>{{ block "title" . }}Живая погода{{ end }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="{{ block "description" . }}{{ .Text.CitiesTitle }}{{ end }}">
    <meta name="theme-color" content="#020617">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <link rel="manifest" href="/manifest.webmanifest">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/atmosphere.css">

    <script>
    (function () {
        try {
            var st = localStorage.getItem("weather:themeMode");
            document.documentElement.style.backgroundColor =
                st === "light" ? "#e8eef5" : "#020617";
        } catch (e) {
            document.documentElement.style.backgroundColor = "#020617";
        }
        try {
            var standalone =
                window.matchMedia("(display-mode: standalone)").matches === true ||
                window.navigator.standalone === true;
            document.documentElement.setAttribute(
                "data-standalone",
                standalone ? "true" : "false"
            );
        } catch (e2) {
            document.documentElement.setAttribute("data-standalone", "false");
        }
    })();
    </script>

    <script src="/static/pwa.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
    <script src="/static/atmosphere.js" defer></script>
    <script src="/static/script.js" defer></script>
</head>
<body class="theme-dark">
<script id="__WEATHER__" type="application/json">{{ .WeatherJSON }}</script>
<script id="__CLIENT_I18N__" type="application/json">{{ .ClientI18n }}</script>
<script src="/static/theme.js"></script>
<div
    class="weather-app {{ .WeatherMood }}"
    data-weather-code="{{ .WeatherCode }}"
    data-is-night="{{ .IsNight }}"
    data-city-id="{{ .CityID }}"
>
    <header class="site-header">
        <div class="shell shell--header">
            <a href="/" class="brand-link" aria-label="{{ .Text.BrandHomeAria }}">
                <div class="brand">
                    <div class="brand-mark" aria-hidden="true">
                        <div class="brand-thermo">
                            <div class="brand-thermo__bulb"></div>
                            <div class="brand-thermo__column"></div>
                        </div>
                    </div>
                    <span class="brand-icon" aria-hidden="true"></span>
                    <div class="brand-text">
                        <span class="brand-text__label">{{ .Text.BrandTop }}</span>
                        <span class="brand-text__title">{{ .Text.BrandBottom }}</span>
                    </div>
                </div>
            </a>

            <button
                type="button"
                id="pwa-install-btn"
                class="pwa-install-btn"
                hidden
                aria-hidden="true"
                data-label-uk="Встановити"
                data-label-en="Install"
                data-label-ru="Установить"
            ></button>

            {{/* Глобальный поиск в шапке */}}
            <div class="search-input-wrap header-search">
                <input
                    type="text"
                    id="js-place-search"
                    class="search-input"
                    placeholder="Поиск города..."
                >
                <button type="button" id="js-geo-btn" class="geo-btn" aria-label="{{ .Text.GeoDetectButton }}">
                    <svg
                        viewBox="0 0 24 24"
                        width="18"
                        height="18"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                        focusable="false"
                    >
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path>
                    </svg>
                </button>
                <div id="js-place-suggestions" class="search-suggestions"></div>
            </div>

            <div class="header-controls">
                <div class="theme-switch" aria-label="{{ .Text.ThemeSwitchAria }}">
                    <button type="button" class="theme-switch__item" data-theme-mode="auto">{{ .Text.ThemeAuto }}</button>
                    <button type="button" class="theme-switch__item" data-theme-mode="light">{{ .Text.ThemeLight }}</button>
                    <button type="button" class="theme-switch__item" data-theme-mode="dark">{{ .Text.ThemeDark }}</button>
                </div>
                <div class="lang-switch" aria-label="{{ .Text.LangSwitchAria }}">
                    <a href="{{ .Path }}?lang=uk" class="lang-switch__item {{ if eq .Lang "uk" }}lang-switch__item--active{{ end }}">UA</a>
                    <a href="{{ .Path }}?lang=en" class="lang-switch__item {{ if eq .Lang "en" }}lang-switch__item--active{{ end }}">EN</a>
                    <a href="{{ .Path }}?lang=ru" class="lang-switch__item {{ if or (eq .Lang "ru") (not .Lang) }}lang-switch__item--active{{ end }}">RU</a>
                </div>
            </div>
        </div>
    </header>

    <main class="site-main" aria-live="polite">
        <div class="shell">
            {{ if .IsIndex }}
                {{ template "index-content" . }}
            {{ else }}
                {{ template "city-content" . }}
            {{ end }}
        </div>
    </main>

    <footer class="site-footer">
        <div class="shell shell--footer">
            <span class="footer-badge">{{ .Text.Footer }}</span>
        </div>
    </footer>
</div>
</body>
</html>
{{ end }}
