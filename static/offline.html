<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Offline</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at 0 0, #1d4ed8 0, transparent 55%),
                radial-gradient(circle at 100% 100%, #f97316 0, transparent 55%),
                #020617;
            color: #e5e7eb;
        }
        .card {
            padding: 1.6rem 1.8rem;
            border-radius: 18px;
            background: rgba(15, 23, 42, 0.96);
            border: 1px solid rgba(148, 163, 184, 0.5);
            box-shadow: 0 22px 50px rgba(15, 23, 42, 1);
            max-width: 360px;
            text-align: center;
        }
        h1 {
            margin: 0 0 0.6rem;
            font-size: 1.3rem;
        }
        p {
            margin: 0;
            font-size: 0.9rem;
            color: #9ca3af;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1 id="offline-h1"></h1>
        <p id="offline-p"></p>
    </div>
    <script>
        (function () {
            function cookieLang() {
                try {
                    var c = document.cookie || "";
                    var m = c.match(/(?:^|;\s*)lang=([^;]+)/i);
                    if (!m) return "";
                    var raw = m[1].trim();
                    var v = decodeURIComponent(raw.replace(/\+/g, " ")).toLowerCase();
                    if (v === "uk" || v === "en" || v === "ru") return v;
                } catch (e) {}
                return "";
            }

            function navLang() {
                var nav = (
                    navigator.language ||
                    navigator.userLanguage ||
                    ""
                ).toLowerCase();
                if (nav.indexOf("uk") === 0) return "uk";
                if (nav.indexOf("en") === 0) return "en";
                return "";
            }

            var lang = cookieLang() || navLang() || "ru";

            var T = {
                uk: {
                    title: "Жива погода — офлайн",
                    h1: "Немає з'єднання",
                    p: "Ви офлайн. Після відновлення з'єднання дані про погоду оновляться автоматично."
                },
                en: {
                    title: "Live Weather — offline",
                    h1: "No connection",
                    p: "You're offline. When you're back online, weather data will refresh automatically."
                },
                ru: {
                    title: "Живая погода — офлайн",
                    h1: "Нет подключения",
                    p: "Вы офлайн. Когда соединение восстановится, данные о погоде обновятся автоматически."
                }
            };

            var t = T[lang] || T.ru;
            document.documentElement.lang = lang;
            document.title = t.title;
            var h1 = document.getElementById("offline-h1");
            var pEl = document.getElementById("offline-p");
            if (h1) h1.textContent = t.h1;
            if (pEl) pEl.textContent = t.p;
        })();
    </script>
</body>
</html>
